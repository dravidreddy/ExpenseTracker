// ── Antigravity Android Build Configuration ────────────────────────────────
//
// Originally generated by Flutter. Modified to add:
//   • Release keystore signing (reads android/key.properties)
//   • signingConfigs.release instead of signingConfigs.debug
//
// To generate the upload keystore (one-time, see KEYSTORE_SETUP.md):
//   keytool -genkey -v -keystore android/app/upload-keystore.jks
//     -keyalg RSA -keysize 2048 -validity 10000 -alias antigravity

def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
def properties = new Properties()

assert localPropertiesFile.exists(), "Missing local.properties"

localPropertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }

def flutterRoot = properties.getProperty("flutter.sdk")
assert flutterRoot != null, "flutter.sdk not set in local.properties"

// ── Load signing credentials from key.properties ──────────────────────────
// key.properties lives in android/ and is NEVER committed to version control.
// See android/key.properties.template for the required structure.

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

apply plugin: 'com.android.application'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    compileSdkVersion 34

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // ── Signing configs ────────────────────────────────────────────────────
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId "com.stormbreaker.expensetracker"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // Uses the production upload keystore defined in key.properties.
            // Falls back to debug signing if key.properties is missing (e.g., CI
            // without secrets configured — prevents accidental debug releases in prod).
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
