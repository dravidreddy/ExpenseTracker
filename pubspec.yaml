name: antigravity
description: Zero-friction offline expense tracker. Fast. Minimal. Yours.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local SQLite storage
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # UI helpers
  flutter_slidable: ^3.1.0
  intl: ^0.19.0

  # Icons (included via Material)
  cupertino_icons: ^1.0.8

  # Persist settings (currency)
  shared_preferences: ^2.3.2
  sqflite_common_ffi_web: ^1.2.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  csv: 6.0.0
  sqflite_sqlcipher: ^3.4.1
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf

