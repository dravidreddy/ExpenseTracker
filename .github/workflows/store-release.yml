name: Store Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android App Bundle & APK'
        required: true
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS Application Archive'
        required: true
        type: boolean
        default: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Android Production Build (Ubuntu Runner)
  # ─────────────────────────────────────────────────────────────────────────────
  build-android:
    if: ${{ github.event_name == 'push' || inputs.build_android == true }}
    name: Build Android Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android CMake 3.22.1
        run: |
          echo "Granting permissions on Android SDK directory..."
          sudo chown -R $USER:$USER $ANDROID_HOME
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(which sdkmanager || echo "")
          fi
          echo "Installing Android SDK CMake 3.22.1 via $SDKMANAGER..."
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER --install "cmake;3.22.1"
          echo "Verifying CMake binary:"
          ls -la "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> $GITHUB_PATH

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding upload-keystore.jks from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Keystore and key.properties configured successfully."
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret not found. Falling back to debug signing."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Configure CMake in local.properties
        run: |
          echo "cmake.dir=$ANDROID_HOME/cmake/3.22.1" >> android/local.properties
          echo "Updated local.properties content:"
          cat android/local.properties

      - name: Verify analysis & tests
        run: |
          flutter analyze
          flutter test

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Build Split Release APKs (.apk)
        run: flutter build apk --release --split-per-abi

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: iOS Production Build (Apple Silicon macOS Runner)
  # ─────────────────────────────────────────────────────────────────────────────
  build-ios:
    if: ${{ github.event_name == 'push' || inputs.build_ios == true }}
    name: Build iOS Release Archive
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Apple Signing Certificate (if configured)
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROV_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temp-build-password-123!"
        run: |
          if [ -n "$CERT_BASE64" ] && [ -n "$PROV_BASE64" ]; then
            echo "Setting up temporary keychain and Apple provisioning..."
            CERT_PATH=$RUNNER_TEMP/build_cert.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo "$CERT_BASE64" | base64 --decode > $CERT_PATH
            echo "$PROV_BASE64" | base64 --decode > $PP_PATH

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            security import $CERT_PATH -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

            echo "Apple certificates and profiles installed."
          else
            echo "Apple signing secrets not provided. Building unsigned release archive..."
          fi

      - name: Build iOS Archive
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}" ]; then
            flutter build ipa --release
          else
            flutter build ios --release --no-codesign
          fi

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-archive
          path: |
            build/ios/archive/*.xcarchive
            build/ios/ipa/*.ipa
            build/ios/iphoneos/Runner.app
          if-no-files-found: warn
